name: Windows virtual lab

on:
  push:
    branches:
      - develop-page-type-fix
    paths:
      - ".github/workflows/windows-virtual-lab.yml"
      - "go.mod"
      - "go.sum"
      - "patches/scrapemate/**"
      - "runner/installplaywright/**"
      - "scripts/prepare-patched-scrapemate.ps1"
      - "PROJECT_SOURCE_OF_TRUTH.json"
  workflow_dispatch:
    inputs:
      run_real_scrape:
        description: Run the opt-in live Google Maps acceptance check
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows-virtual-lab:
    name: Windows build and optional live acceptance
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      DISABLE_TELEMETRY: "1"
      GOMAXPROCS: "1"
      PLAYWRIGHT_DRIVER_PATH: ${{ github.workspace }}\.playwright\driver
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright\browsers

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Go version
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Record Windows environment
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path reports, dist | Out-Null
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture |
            Format-List | Out-File reports\windows-environment.txt
          go version | Tee-Object -FilePath reports\go-version.txt
          git rev-parse HEAD | Tee-Object -FilePath reports\source-commit.txt
          "event_name=${{ github.event_name }}" | Out-File reports\workflow-mode.txt
          "run_real_scrape=${{ inputs.run_real_scrape }}" | Out-File reports\workflow-mode.txt -Append

      - name: Prepare and test pinned dependency patch
        shell: powershell
        run: |
          .\scripts\prepare-patched-scrapemate.ps1 -ProjectRoot $PWD
          Select-String -Path .\.patched\scrapemate\adapters\fetchers\jshttp\session_slot.go `
            -Pattern "return p.p.IsClosed|recreateBrowser" `
            -Context 3,5 |
            Out-File reports\patched-source-proof.txt

      - name: Verify dependencies
        shell: powershell
        run: |
          go mod verify 2>&1 | Out-File reports\go-mod-verify.log
          if ($LASTEXITCODE -ne 0) { throw "go mod verify failed: $LASTEXITCODE" }

      - name: Run repository tests serially
        shell: powershell
        run: |
          $go = (Get-Command go).Source
          $p = Start-Process -FilePath $go `
            -ArgumentList @("test", "-p", "1", "./...", "-count=1") `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput reports\go-test.stdout.log `
            -RedirectStandardError reports\go-test.stderr.log
          Get-Content reports\go-test.stdout.log
          Get-Content reports\go-test.stderr.log
          if ($p.ExitCode -ne 0) { throw "Go tests failed: $($p.ExitCode)" }

      - name: Build Windows executable
        shell: powershell
        run: |
          $go = (Get-Command go).Source
          $p = Start-Process -FilePath $go `
            -ArgumentList @("build", "-p", "1", "-trimpath", "-o", "dist\google-maps-scraper.exe", ".") `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput reports\go-build.stdout.log `
            -RedirectStandardError reports\go-build.stderr.log
          Get-Content reports\go-build.stdout.log
          Get-Content reports\go-build.stderr.log
          if ($p.ExitCode -ne 0) { throw "Go build failed: $($p.ExitCode)" }
          Get-FileHash dist\google-maps-scraper.exe -Algorithm SHA256 |
            Format-List | Out-File reports\exe-sha256.txt
          .\dist\google-maps-scraper.exe -version |
            Tee-Object -FilePath reports\version-output.txt
          if ($LASTEXITCODE -ne 0) { throw "EXE version smoke test failed: $LASTEXITCODE" }

      - name: Install Chromium runtime
        shell: powershell
        run: |
          $env:PLAYWRIGHT_INSTALL_ONLY = "1"
          $p = Start-Process -FilePath .\dist\google-maps-scraper.exe `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput reports\playwright-install.stdout.log `
            -RedirectStandardError reports\playwright-install.stderr.log
          Remove-Item Env:PLAYWRIGHT_INSTALL_ONLY -ErrorAction SilentlyContinue
          Get-Content reports\playwright-install.stdout.log
          Get-Content reports\playwright-install.stderr.log
          if ($p.ExitCode -ne 0) { throw "Chromium install failed: $($p.ExitCode)" }
          $driverCli = Join-Path $env:PLAYWRIGHT_DRIVER_PATH "package\cli.js"
          if (!(Test-Path -LiteralPath $driverCli)) {
            throw "Playwright driver is missing: $driverCli"
          }
          $browserDirs = @(Get-ChildItem -Directory -LiteralPath $env:PLAYWRIGHT_BROWSERS_PATH)
          if ($browserDirs.Count -lt 1) {
            throw "Playwright installed no browser directories"
          }
          "driver_cli=$driverCli" | Out-File reports\playwright-install-proof.txt
          "browser_directory_count=$($browserDirs.Count)" |
            Out-File reports\playwright-install-proof.txt -Append
          $browserDirs.FullName | Out-File reports\playwright-install-proof.txt -Append

      - name: Create one public business query
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_scrape }}
        shell: powershell
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "sample-query.txt"),
            "Tokyo hot pot restaurant",
            $utf8NoBom
          )

      - name: Run opt-in live acceptance scrape
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_scrape }}
        shell: powershell
        run: |
          Remove-Item Env:PLAYWRIGHT_INSTALL_ONLY -ErrorAction SilentlyContinue
          Remove-Item dist\sample-results.csv -Force -ErrorAction SilentlyContinue
          $args = @(
            "-input", "sample-query.txt",
            "-results", "dist\sample-results.csv",
            "-depth", "1",
            "-c", "1",
            "-browser-pool-size", "1",
            "-pages-per-browser", "1",
            "-disable-page-reuse",
            "-exit-on-inactivity", "3m"
          )
          $p = Start-Process -FilePath .\dist\google-maps-scraper.exe `
            -ArgumentList $args `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput reports\real-scrape.stdout.log `
            -RedirectStandardError reports\real-scrape.stderr.log
          Get-Content reports\real-scrape.stdout.log
          Get-Content reports\real-scrape.stderr.log
          "exit_code=$($p.ExitCode)" | Out-File reports\real-scrape-exit-code.txt
          if ($p.ExitCode -ne 0) { throw "Live acceptance scrape failed: $($p.ExitCode)" }

      - name: Validate live CSV data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_scrape }}
        shell: powershell
        run: |
          if (!(Test-Path "dist\sample-results.csv")) {
            throw "No CSV file was generated"
          }
          $file = Get-Item "dist\sample-results.csv"
          if ($file.Length -lt 100) {
            throw "CSV is too small: $($file.Length) bytes"
          }
          $rows = @(Import-Csv "dist\sample-results.csv")
          if ($rows.Count -lt 1) {
            throw "CSV contains no business rows"
          }
          "row_count=$($rows.Count)" | Tee-Object -FilePath reports\real-scrape-summary.txt
          $rows |
            Select-Object -First 5 title, category, address, phone, website, latitude, longitude |
            Format-Table -AutoSize |
            Out-String |
            Set-Content reports\sample-preview.txt
          Get-FileHash "dist\sample-results.csv" -Algorithm SHA256 |
            Format-List |
            Out-File reports\sample-results-sha256.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-virtual-lab-evidence
          path: |
            reports/
            dist/google-maps-scraper.exe
            dist/sample-results.csv
            .patched/scrapemate/adapters/fetchers/jshttp/session_slot.go
            .patched/scrapemate/adapters/fetchers/jshttp/session_slot_recovery_patch_test.go
            PROJECT_SOURCE_OF_TRUTH.json
          if-no-files-found: warn
          retention-days: 30
